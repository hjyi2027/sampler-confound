name: tests

# The suite must pass without a key and without the response cache: every test
# either fakes the transport or reads committed records. A test that needs the
# network has a bug, and this catches it.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: tests
        run: python -m pytest -q
      - name: reports regenerate from committed records
        env:
          SAMPLERCONFOUND_OFFLINE: "1"
        run: |
          python scripts/probe_matrix.py
          python scripts/gap.py
          python scripts/unparseable_report.py
          python scripts/date_probes.py --check
          python scripts/paper_numbers.py
